#
# Re-diffed at the 0.42.0 -> 0.44.0 upgrade against the pinned CLI itself
# (`jj config list --include-defaults revset-aliases`). jj 0.44.0 adds one alias,
# `builtin_log()`; every other alias is byte-identical to the 0.42.0 table.
# `tests/test_revset_config.py` asserts this table equals the pinned CLI's defaults exactly.

[revset-aliases]
"trunk()" = '''
latest(
  remote_bookmarks(exact:"main", exact:"origin") |
  remote_bookmarks(exact:"master", exact:"origin") |
  remote_bookmarks(exact:"trunk", exact:"origin") |
  remote_bookmarks(exact:"main", exact:"upstream") |
  remote_bookmarks(exact:"master", exact:"upstream") |
  remote_bookmarks(exact:"trunk", exact:"upstream") |
  root()
)
'''
"builtin_log()" = 'present(@) | ancestors(immutable_heads().., 2) | trunk()'
"builtin_immutable_heads()" = 'trunk() | tags() | untracked_remote_bookmarks()'
"immutable_heads()" = 'builtin_immutable_heads()'
"immutable()" = '::(immutable_heads() | root())'
"mutable()" = '~immutable()'
"visible()" = '::visible_heads()'
"hidden()" = '~visible()'
