[package]
name = "pyjutsu"
version = "0.17.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Thin PyO3 binding to jujutsu's jj-lib engine (the _pyjutsu native extension)."

[lib]
name = "_pyjutsu"
crate-type = ["cdylib"]

[dependencies]
# Hard pin: this exact version is the real API contract. Cargo.lock is committed. Bumping
# jj-lib is a deliberate Rust-side port; pyjutsu's own version (above) moves independently.
jj-lib = "=0.44.0"

# `extension-module` is NOT enabled here so that `cargo test` can link libpython; maturin
# turns it on via [tool.maturin] features in pyproject.toml when building the wheel/develop.
pyo3 = { version = "0.24", features = ["abi3-py313"] }

# The revset parse context wants a `DatePatternContext`, built from a chrono datetime. Tracks
# jj-lib's own chrono (resolves to the same locked 0.4.x); only `now()` is used.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# pollster drives jj-lib's many async APIs (tree-diff streams, revset streams, commit/working-copy
# writes) to completion synchronously off the GIL; futures supplies StreamExt/TryStreamExt for the
# streams and AsyncReadExt for reading file blobs (jj-lib 0.44's `Store::read_file` yields a
# `futures::io::AsyncRead`). Both track jj-lib's locked versions.
pollster = "0.4"
futures = "0.3"
sha1 = "0.10"

# jj-cli owns environment and config-path policy, while jj-lib owns the configuration data model.
# These exact jj 0.44 dependencies support Pyjutsu's small parity adapter without linking jj-cli.
dunce = "=1.0.5"
etcetera = "=0.11.0"
rand = "=0.10.1"
rand_chacha = "=0.10.0"
whoami = "=2.1.2"

# There is no public jj-lib remote-URL reader, so we read it back via
# `gix::Remote::url(Direction::Fetch)`. Pinned to jj-lib 0.44.0's own locked gix so the types unify
# (Cargo reuses the single 0.85.0 build;
# `cargo tree -i gix` must show one version). default-features = false keeps the direct edge lean.
#
# `sha1` and `sha256` gate the two `gix::hash::Kind` variants that `git_object_hash` names when it
# creates a repo (jj-lib 0.44's `init_*_git` takes the kind directly). jj-lib enables both on its
# own edge, so declaring them here adds no build; it states what Pyjutsu itself calls instead of
# relying on a transitive crate's feature choice. This supersedes the earlier "do not declare
# `sha1`" decision, which assumed no Pyjutsu code would name a `gix::hash` item after lane A1.
gix = { version = "=0.85.0", default-features = false, features = ["sha1", "sha256"] }
