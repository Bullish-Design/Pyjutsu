# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # jujutsu is pinned to 0.44.0 — the exact jj-lib version Pyjutsu binds (Cargo.toml
  # pins `jj-lib = "=0.44.0"`). Differential tests must compare against the CLI of the
  # bound library, so the `jj` binary comes from this dedicated nixpkgs rev (the commit
  # that bumped jujutsu to 0.44.0), NOT rolling (which may ship a different jj).
  nixpkgs-jj:
    url: github:NixOS/nixpkgs/a5c43f1df1e17386c951571ec4a7942d2e9cda2e
  # Provides the exact CPython for `languages.python.version = "3.13"`.
  nixpkgs-python:
    url: github:cachix/nixpkgs-python
  # shellij: durable Zellij workbenches. This repo does not import RepoMan's
  # meta-module, so it imports shellij's devenv module directly — shellij/zellij/
  # yazi packages, the guarded `shellij open` enterShell hook, and
  # YAZI_CONFIG_HOME pointing at the packaged Yazi assets.
  shellij:
    url: path:/home/andrew/Documents/Projects/shellij

  # devman: the automation plane's repo interface (CONCEPT.md §3.2). A devenv
  # import is a PATH inside an input, never a flake output attribute, and the
  # file it resolves to must be named devenv.nix.
  devman:
    url: "git+https://github.com/Bullish-Design/devman?ref=main&rev=02d00f64f7a1fe5003380ef4e7fb9464d1cef910"

imports:
  - shellij/modules
  - devman/modules

# If you're using non-OSS software, you can set allowUnfree to true.
# allowUnfree: true

# If you're willing to use a package that's vulnerable
# permittedInsecurePackages:
#  - "openssl-1.1.1w"

# If you have more than one devenv you can merge them
#imports:
# - ./backend
